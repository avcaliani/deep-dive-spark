status = warn

rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy/MM/dd HH:mm:ss} %highlight{%p}{FATAL=red, ERROR=red, WARN=yellow, INFO=cyan, DEBUG=green} [%t] %c: %m%n

# Spark Stuff
logger.spark_repl.name = org.apache.spark.repl.Main
logger.spark_repl.level = warn

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn

logger.spark_sql.name = org.apache.spark.sql
logger.spark_sql.level = warn

logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.hive_retry.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.hive_retry.level = fatal

logger.hive_fn.name = org.apache.hadoop.hive.ql.exec.FunctionRegistry
logger.hive_fn.level = error

# My Packages
logger.app.name = br.avcaliani.kwikechain
logger.app.level = debug
